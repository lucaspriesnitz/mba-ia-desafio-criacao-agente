[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK)"
authors = [
    { name = "Lucas Gebauer Priesnitz", email = "nelumbusnucifero@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk==2.9.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
restaurar = "residencial_aurora.restaurar:main"
api = "residencial_aurora.api:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
